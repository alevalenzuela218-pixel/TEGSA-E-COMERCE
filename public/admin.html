<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERP · TEGSA Iluminación</title>
<link rel="icon" type="image/png" href="/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body class="erp">
<div class="erp-shell">
  <aside class="erp-side">
    <a class="erp-brand" href="/"><img src="/img/logo.png" class="logo" alt="TEGSA"><span>ERP</span></a>
    <nav class="erp-nav" id="erpNav">
      <button data-sec="resumen" class="active">📊 Resumen</button>
      <button data-sec="productos">📦 Productos y precios</button>
      <button data-sec="proveedores">🏭 Proveedores</button>
      <button data-sec="stock">📥 Stock</button>
      <button data-sec="ventas">💼 Ventas (pipeline)</button>
      <button data-sec="finanzas">📈 Finanzas / Punto de equilibrio</button>
    </nav>
    <div class="erp-foot"><a href="/" class="erp-link">← Ver tienda</a></div>
  </aside>
  <main class="erp-main" id="erpMain"><p class="an-sub">Cargando…</p></main>
</div>
<div class="toast" id="toast"></div>
<div class="overlay" id="overlay"><div class="modal" id="modalContent"></div></div>
<script src="/admin.js"></script>
</body>
</html>
